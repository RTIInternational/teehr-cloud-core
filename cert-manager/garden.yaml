kind: Deploy
type: helm
name: cert-manager
environments:
  # local only.  cert-manager is installed in the remote cluster by the
  # helm_release in teehr-cloud-platform/terraform/cert-manager.tf
  - local
spec:
  chart:
    name: cert-manager
    repo: https://charts.jetstack.io
    # Keep in step with teehr-cloud-platform/terraform/cert-manager.tf.
    # v1.21 is tested on Kubernetes 1.33-1.36; KinD and the remote cluster are both on 1.36.
    version: "v1.21.2"
  namespace: cert-manager
  values:
    # installCRDs is deprecated as of chart v1.15
    crds:
      enabled: true
      keep: true
---
kind: Deploy
type: kubernetes
name: letsencrypt
description: K8s Lets Encrypt
spec:
  manifestFiles:
    - "./manifests/letsencrypt-self-signed.yaml"
dependencies:
  - deploy.cert-manager
environments:
  - local
---
kind: Deploy
type: kubernetes
name: core-certs
description: Core K8s certificates
spec:
  manifestTemplates:
    - "./manifests/cert.yaml.tpl"
environments:
  - remote
---
kind: Deploy
type: kubernetes
name: core-certs
description: Core K8s certificates
spec:
  manifestTemplates:
    - "./manifests/cert.yaml.tpl"
dependencies:
  - deploy.letsencrypt
environments:
  - local