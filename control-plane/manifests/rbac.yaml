# The control plane's own service account. It starts the Kubernetes Jobs that run
# work users start through the API (uploads now, evaluation runs later; ADR-0014):
# Jobs only, and reading their pods (why a job failed), in this namespace.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teehr-control-plane
  labels:
    app: teehr-control-plane
    component: control-plane
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: teehr-control-plane-jobs
  labels:
    app: teehr-control-plane
    component: control-plane
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: teehr-control-plane-jobs
  labels:
    app: teehr-control-plane
    component: control-plane
subjects:
  - kind: ServiceAccount
    name: teehr-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: teehr-control-plane-jobs
