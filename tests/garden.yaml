kind: Build
type: container
name: test-scripts
dependencies:
  - build.teehr-jupyter-driver-image-edge
environments:
  - local
spec:
  dockerfile: Dockerfile
  localId: test-scripts
  buildArgs:
    BASE_IMAGE: ${actions.build.teehr-jupyter-driver-image-edge.outputs.deploymentImageName}:${actions.build.teehr-jupyter-driver-image-edge.version}

---
kind: Test
name: polaris-keycloak-users
dependencies:
  - deploy.keycloak-local-users-bootstrap
  - build.test-scripts
timeout: 180
type: container
spec:
  image: ${actions.build.test-scripts.outputs.deploymentImageName}:${actions.build.test-scripts.version}
  command:
    - python3
    - /app/tests/keycloak_users_test.py

