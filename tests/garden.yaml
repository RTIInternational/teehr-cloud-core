---
kind: Test
name: spark-authmanager-executor-enforcement
description: >-
  Cluster-mode AuthManager test -- confirms Spark executors (not just the
  driver) get the Polaris auth env vars they need and can participate in a
  real distributed Iceberg write/read, unlike spark-authmanager-enforcement
  above which only exercises local (driver-only) mode.
dependencies:
  - deploy.polaris-bootstrap
  - deploy.keycloak-local-users-bootstrap
  - deploy.teehr-api
  - build.test-scripts
  - build.teehr-spark-executor-image
timeout: 600
type: kubernetes-pod
spec:
  podSpec:
    serviceAccountName: jupyter
    restartPolicy: Never
    containers:
      - name: spark-authmanager-executor-test
        image: ${actions.build.test-scripts.outputs.deploymentImageName}:${actions.build.test-scripts.version}
        command:
          - python3
          - /app/tests/spark_authmanager_executor_test.py
        env:
          - name: TEEHR_SPARK_IMAGE
            value: ${actions.build.teehr-spark-executor-image.outputs.deploymentImageId}
        resources:
          requests:
            memory: 2Gi
            cpu: "1"
          limits:
            memory: 3Gi
            cpu: "2"

---
kind: Test
name: xpublish-access-enforcement
description: >-
  Icechunk access rules enforced by xpublish-api: listings, dataset routes, the notebook
  credentials route, 401s and fail-closed paths, per persona, with real Keycloak tokens.
  Expected access comes from the deployed rules (xpublish-api's ConfigMap).
dependencies:
  - deploy.xpublish-api
  - deploy.keycloak-local-users-bootstrap
  - build.test-scripts
timeout: 600
type: kubernetes-pod
spec:
  podSpec:
    restartPolicy: Never
    containers:
      - name: xpublish-access-test
        image: ${actions.build.test-scripts.outputs.deploymentImageName}:${actions.build.test-scripts.version}
        command:
          - python3
          - /app/tests/xpublish_access_test.py
        env:
          - name: TEEHR_ACCESS_RULES
            valueFrom:
              configMapKeyRef:
                name: xpublish-api-config
                key: TEEHR_ACCESS_RULES
          - name: ICECHUNK_BUCKET
            valueFrom:
              configMapKeyRef:
                name: xpublish-api-config
                key: ICECHUNK_BUCKET
          - name: ICECHUNK_PREFIX
            valueFrom:
              configMapKeyRef:
                name: xpublish-api-config
                key: ICECHUNK_PREFIX
          - name: AWS_ACCESS_KEY_ID
            valueFrom:
              secretKeyRef:
                name: local-s3-secrets
                key: accesskey
          - name: AWS_SECRET_ACCESS_KEY
            valueFrom:
              secretKeyRef:
                name: local-s3-secrets
                key: secretkey
        resources:
          requests:
            memory: 512Mi
            cpu: "250m"
          limits:
            memory: 1Gi
