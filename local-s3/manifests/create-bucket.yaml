apiVersion: batch/v1
kind: Job
metadata:
  name: create-local-s3-bucket
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      containers:
      # Plain S3 API, so it works against any S3-compatible backend.
      - name: create-bucket
        image: amazon/aws-cli:2.36.45
        command: ["/bin/sh", "-c"]
        args:
          - |
            set -eu
            S3="aws --endpoint-url $S3_ENDPOINT s3api"
            # create-bucket fails if the bucket exists, so check first.
            if $S3 head-bucket --bucket warehouse 2>/dev/null; then
              echo "bucket warehouse already exists"
            else
              $S3 create-bucket --bucket warehouse
              echo "created bucket warehouse"
            fi
        env:
        - name: S3_ENDPOINT
          value: http://local-s3:9000
        - name: AWS_DEFAULT_REGION
          value: us-east-1
        - name: AWS_ACCESS_KEY_ID
          valueFrom:
            secretKeyRef:
              name: local-s3-secrets
              key: accesskey
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: local-s3-secrets
              key: secretkey
      restartPolicy: Never
