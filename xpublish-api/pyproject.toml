[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "teehr-hub-xpublish-api"
version = "0.1.0"
description = "xpublish tile and EDR service for icechunk gridded data"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.27.0",
    "python-jose[cryptography]>=3.3.0",
    "httpx>=0.26.0",
    # Gridded stack: allows patch updates but blocks minor/major changes, which have broken it before
    "xpublish~=0.5.2",
    "xpublish-tiles~=0.9.2",
    "xpublish-edr~=0.11.1",
    "icechunk~=2.2.2",
    "xarray~=2026.9.0",
    "zarr~=3.4.0",
    "numpy>=1.26.0",
    "boto3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
